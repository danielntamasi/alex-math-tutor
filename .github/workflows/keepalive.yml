# Keeps the free Supabase project from pausing (it pauses after ~7 days without activity).
# Runs once a day and can also be started by hand from the Actions tab.
name: Keep database awake

on:
  schedule:
    - cron: "17 15 * * *"   # every day at 15:17 UTC (7:17 / 8:17 am Pacific)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          # A login attempt for a profile that doesn't exist: harmless, but it runs a real database query.
          code=$(curl -sS -o response.txt -w "%{http_code}" -X POST \
            "https://zrdoyjuffrrcwanhldlb.supabase.co/rest/v1/rpc/login" \
            -H "apikey: sb_publishable_9PxC5FlytfWdJZfVQhY-1w_kofsYcP0" \
            -H "Content-Type: application/json" \
            -d '{"p_user":"keepalive","p_pass":"x"}')
          cat response.txt; echo
          echo "HTTP $code"
          test "$code" = "200"
